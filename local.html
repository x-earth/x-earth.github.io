<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earth · 本机个人主页</title><link rel="stylesheet" href="local.css"></head><body><main><header><div><small>LOCAL / PRIVATE</small><h1>Earth 个人主页</h1><p>只在这台 Ubuntu 上运行，数据保存在本机。</p></div><span class="lock">127.0.0.1</span></header><section class="grid"><article><h2>本地剪贴板</h2><textarea id="clip" placeholder="粘贴文字、代码或链接…"></textarea><button onclick="saveText()">保存文字</button><button class="secondary" onclick="navigator.clipboard.writeText(clip.value)">复制</button><div id="clips"></div></article><article><h2>文件传输</h2><input id="files" type="file" multiple><button onclick="upload()">上传到本机</button><div id="filelist"></div></article><article class="wide"><h2>私密备忘</h2><input id="ntitle" placeholder="标题"><textarea id="note" placeholder="只保存在本机的备忘内容…"></textarea><button onclick="saveNote()">保存备忘</button><div id="notes"></div></article></section></main><script src="local.js"></script></body></html>
